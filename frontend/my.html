<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>我的 - TTAI</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="index.html">
            <span class="brand-mark">TT</span>
            <span>TTAI 乒乓训练</span>
          </a>
          <nav class="nav-links">
            <a href="index.html">首页</a>
            <a href="videos.html">视频库</a>
            <a href="tech.html">日常训练</a>
            <a href="training-enroll.html">俱乐部</a>
            <a href="stats.html">训练统计</a>
            <a class="active" href="my.html">我的</a>
            <a href="login.html" id="nav-login">登录</a>
            <div class="nav-user" id="nav-user" style="display: none;">
              <img class="nav-avatar" id="nav-avatar" alt="头像">
              <span class="nav-name" id="nav-name">已登录</span>
              <button class="nav-logout" id="nav-logout" type="button">退出</button>
            </div>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container">
          <section class="section">
            <h2 class="card-title">我的训练档案</h2>
            <div class="grid-2">
              <div class="card">
                <h3 class="card-title">账号信息</h3>
                <p class="muted" id="profile-name">登录后展示昵称、头像与训练标签。</p>
                <div class="profile-summary" id="profile-summary" style="display: none;">
                  <img id="profile-avatar" class="profile-avatar" alt="头像" />
                  <div>
                    <p class="profile-nickname" id="profile-nickname"></p>
                    <div class="tag-list" id="profile-tags"></div>
                  </div>
                </div>
                <div class="empty-state" id="profile-empty">请先登录以同步你的训练数据。</div>
              </div>
              <div class="card membership-summary-card">
                <div class="card-heading-row">
                  <h3 class="card-title">会员与云存储</h3>
                  <a class="text-link" href="membership.html">查看权益</a>
                </div>
                <p class="muted" id="quota-info">会员权益与云端空间展示区。</p>
                <div class="membership-summary" id="membership-summary" hidden>
                  <div class="membership-summary-head">
                    <div>
                      <span class="membership-tier" id="membership-tier">--</span>
                      <p class="membership-expiry" id="membership-expiry">--</p>
                    </div>
                    <a class="btn btn-secondary membership-summary-action" href="membership.html">会员中心</a>
                  </div>
                  <div class="membership-meter-row">
                    <div class="membership-meter-label">
                      <span>本月 AI 分析</span>
                      <strong id="analysis-usage">--</strong>
                    </div>
                    <div class="membership-meter-track" aria-hidden="true">
                      <span class="membership-meter-fill" id="analysis-meter"></span>
                    </div>
                  </div>
                  <div class="membership-meter-row" id="storage-meter-row" hidden>
                    <div class="membership-meter-label">
                      <span>云端空间</span>
                      <strong id="storage-usage">--</strong>
                    </div>
                    <div class="membership-meter-track" aria-hidden="true">
                      <span class="membership-meter-fill storage" id="storage-meter"></span>
                    </div>
                    <p class="membership-storage-status" id="storage-status"></p>
                  </div>
                  <div class="membership-summary-links">
                    <a href="membership.html#orders">我的订单</a>
                    <a href="videos.html">管理视频</a>
                  </div>
                </div>
                <div class="empty-state" id="quota-empty">暂无配额数据。</div>
              </div>
            </div>
          </section>

          <section class="section">
            <h3 class="card-title">数据概览</h3>
            <div class="stat-grid">
              <div class="stat-card">
                <h4>本月训练</h4>
                <p id="stat-days">--</p>
              </div>
              <div class="stat-card">
                <h4>累计时长</h4>
                <p id="stat-hours">--</p>
              </div>
              <div class="stat-card">
                <h4>AI 综合分</h4>
                <p id="stat-score">--</p>
              </div>
              <div class="stat-card">
                <h4>对手数量</h4>
                <p id="stat-opponents">--</p>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer>
        <p>&copy; <span id="year"></span> TTAI. All rights reserved.</p>
      </footer>
    </div>
    <script src="config.js"></script>
    <script src="nav-auth.js"></script>
    <script src="my.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
