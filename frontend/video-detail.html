<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>视频详情 - TTAI</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="index.html">
            <span class="brand-mark">TT</span>
            <span>TTAI 乒乓训练</span>
          </a>
          <nav class="nav-links">
            <a href="index.html">首页</a>
            <a href="videos.html">视频库</a>
            <a href="tech.html">日常训练</a>
            <a href="training-enroll.html">俱乐部</a>
            <a href="stats.html">训练统计</a>
            <a href="my.html">我的</a>
            <a href="login.html" id="nav-login">登录</a>
            <div class="nav-user" id="nav-user" style="display: none;">
              <img class="nav-avatar" id="nav-avatar" alt="头像">
              <span class="nav-name" id="nav-name">已登录</span>
              <button class="nav-logout" id="nav-logout" type="button">退出</button>
            </div>
          </nav>
        </div>
      </header>

      <main class="main">
        <div class="container">
          <section class="section video-detail-player-section">
            <div class="video-detail-heading">
              <div>
                <a class="text-link" href="videos.html">返回视频库</a>
                <h2 class="card-title" id="video-title">视频详情</h2>
                <p class="muted" id="video-meta"></p>
              </div>
              <div class="video-detail-nav" aria-label="切换视频">
                <button type="button" id="previous-video" title="上一个视频" aria-label="上一个视频">←</button>
                <button type="button" id="next-video" title="下一个视频" aria-label="下一个视频">→</button>
              </div>
            </div>
            <div class="video-detail-player-wrap">
              <video controls width="100%" poster="images/main.png" id="video-player">
                <source src="" type="video/mp4">
              </video>
              <div class="video-expired-state" id="video-expired-state" hidden>
                <strong>视频已过期</strong>
                <span>AI 分析报告仍然保留</span>
              </div>
            </div>
            <div class="upload-actions detail-video-actions" id="playback-actions">
              <button class="btn btn-primary" type="button" id="btn-immersive">沉浸播放</button>
            </div>
          </section>

          <section class="section video-detail-info-section">
            <div class="video-detail-tabs" role="tablist" aria-label="视频信息">
              <button class="video-detail-tab active" type="button" data-detail-tab="basic" role="tab" aria-selected="true">基本信息</button>
              <button class="video-detail-tab" type="button" data-detail-tab="score" role="tab" aria-selected="false">AI评分</button>
            </div>

            <div class="video-detail-panel" data-detail-panel="basic">
              <dl class="video-detail-fields">
                <div class="video-detail-field title-field">
                  <dt>标题</dt>
                  <dd>
                    <button class="video-inline-value" type="button" id="detail-title-value">未命名</button>
                    <form class="video-inline-editor" id="title-editor" hidden>
                      <input type="text" id="title-input" maxlength="80" aria-label="视频标题">
                      <button type="submit">保存</button>
                      <button type="button" id="cancel-title-edit">取消</button>
                    </form>
                  </dd>
                </div>
                <div class="video-detail-field">
                  <dt>日期</dt>
                  <dd id="detail-date">--</dd>
                </div>
                <div class="video-detail-field">
                  <dt>对手</dt>
                  <dd>
                    <select id="detail-opponent" aria-label="关联对手">
                      <option value="">关联对手</option>
                    </select>
                    <span class="video-inline-status" id="opponent-update-status"></span>
                  </dd>
                </div>
                <div class="video-detail-field">
                  <dt>模式</dt>
                  <dd id="detail-mode">--</dd>
                </div>
                <div class="video-detail-field">
                  <dt>时长</dt>
                  <dd id="detail-duration">--</dd>
                </div>
                <div class="video-detail-field">
                  <dt>大小</dt>
                  <dd id="detail-size">--</dd>
                </div>
                <div class="video-detail-field" id="detail-rallies-row" hidden>
                  <dt>回合</dt>
                  <dd id="detail-rallies">--</dd>
                </div>
              </dl>
              <div class="video-detail-actions">
                <button class="btn btn-secondary" type="button" id="btn-download">下载视频</button>
                <button class="btn btn-secondary danger" type="button" id="btn-delete">删除</button>
              </div>
            </div>

            <div class="video-detail-panel" data-detail-panel="score" hidden>
              <div class="stat-grid" id="score-grid"></div>
              <div class="video-advice" id="video-advice" hidden>
                <strong>AI 建议</strong>
                <p></p>
              </div>
              <div class="match-evaluation" id="match-evaluation" hidden></div>
            </div>
          </section>

          <section class="section video-overlay-section" id="overlay-box" hidden>
            <div class="section-header compact">
              <div>
                <h3 class="card-title">覆盖层切换</h3>
                <p class="muted">仅训练分析视频支持。</p>
              </div>
              <div class="upload-actions">
                <button class="btn btn-secondary btn-primary" type="button" data-overlay="all">全部</button>
                <button class="btn btn-secondary" type="button" data-overlay="skeleton">骨骼</button>
                <button class="btn btn-secondary" type="button" data-overlay="fishbone">鱼骨</button>
                <button class="btn btn-secondary" type="button" data-overlay="angles">角度</button>
              </div>
            </div>
            <div class="overlay-status" id="overlay-status">选择覆盖层即可切换训练视图。</div>
          </section>
        </div>
      </main>

      <div class="immersive-player" id="immersive-player" hidden>
        <div class="immersive-shell">
          <div class="immersive-top">
            <button class="immersive-close" type="button" id="immersive-close" aria-label="关闭">‹</button>
            <div class="immersive-titlebox">
              <strong id="immersive-title">比赛回放</strong>
              <span id="immersive-subtitle">比赛视频分析</span>
            </div>
            <button class="immersive-pill" type="button" id="immersive-list-toggle">记录列表</button>
          </div>

          <div class="immersive-current">
            <div>
              <strong id="immersive-current-title">完整比赛</strong>
              <span id="immersive-current-subtitle">全部有效回合</span>
            </div>
            <div class="immersive-stats" id="immersive-stats"></div>
          </div>

          <div class="immersive-video-wrap">
            <video id="immersive-video" controls playsinline></video>
          </div>

          <div class="immersive-actions" id="immersive-actions">
            <button class="immersive-action" type="button" id="immersive-favorite">
              <span class="immersive-action-icon">☆</span>
              <span>收藏</span>
            </button>
            <button class="immersive-action" type="button" id="immersive-speed">
              <span class="immersive-action-icon" id="immersive-speed-label">1倍</span>
              <span>倍速</span>
            </button>
            <button class="immersive-action" type="button" id="immersive-download">
              <span class="immersive-action-icon">↓</span>
              <span>下载</span>
            </button>
            <button class="immersive-action" type="button" id="immersive-share">
              <span class="immersive-action-icon">↗</span>
              <span>分享</span>
            </button>
            <button class="immersive-action" type="button" id="immersive-fullscreen">
              <span class="immersive-action-icon">⛶</span>
              <span>全屏</span>
            </button>
          </div>

          <div class="immersive-record-panel" id="immersive-record-panel" hidden>
            <div class="immersive-record-head">
              <strong id="immersive-record-title">共0条记录</strong>
              <div class="immersive-record-filters">
                <button class="immersive-record-filter active" type="button" data-player-sort="all">全部</button>
                <button class="immersive-record-filter" type="button" data-player-sort="score">按评分</button>
              </div>
            </div>
            <div class="immersive-record-list" id="immersive-clip-list"></div>
          </div>

          <div class="immersive-share-status" id="immersive-share-status"></div>
        </div>
      </div>

      <footer>
        <p>&copy; <span id="year"></span> TTAI. All rights reserved.</p>
      </footer>
    </div>
    <script src="config.js"></script>
    <script src="nav-auth.js"></script>
    <script src="video-detail.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
